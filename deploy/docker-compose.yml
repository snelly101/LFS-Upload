# Together Housing Secure File Send – single-host deployment.
# Only caddy publishes ports (80/443). Everything else lives on private networks; the database has no route out.
# Images are pinned by tag; see docs/UPGRADE.md for the update procedure.
# The Docker socket is never mounted into any container.

name: securesend

x-app-common: &app-common
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    # Build steps use the host network: in DMZ/firewalled hosts the BuildKit bridge sometimes cannot
    # reach the npm registry even when ordinary containers can. Runtime services are unaffected.
    network: host
  image: securesend:local
  env_file: .env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: "3000"
    DATABASE_URL: postgres://securesend:${POSTGRES_PASSWORD}@db:5432/securesend
    CONTENT_ROOT: /srv/content
    CLAMD_HOST: clamav
    CLAMD_PORT: "3310"
    WEB_DIST: /app/apps/web/dist
  volumes:
    # /srv/securesend/content must be a LUKS-encrypted filesystem excluded from backups (docs/INSTALL.md).
    - /srv/securesend/content:/srv/content
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "50m", max-file: "5" }
  depends_on:
    db: { condition: service_healthy }
    clamav: { condition: service_started }

services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
      TLS_MODE: ${TLS_MODE:-acme}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy:/etc/caddy/caddy:ro
      - ./caddy/tls-acme.caddy:/etc/caddy/tls-acme.caddy:ro
      - ./caddy/tls-internal.caddy:/etc/caddy/tls-internal.caddy:ro
      - ./caddy/tls-custom.caddy:/etc/caddy/tls-custom.caddy:ro
      # For TLS_MODE=custom, also mount your certificate and key:
      # - /etc/securesend/certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt:
      - no-new-privileges:true
    networks: [frontend]
    depends_on: [api]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }

  api:
    <<: *app-common
    command: ["node", "dist/server.js"]
    networks: [frontend, backend, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1536M }

  worker:
    <<: *app-common
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://securesend:${POSTGRES_PASSWORD}@db:5432/securesend
      CONTENT_ROOT: /srv/content
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      WORKER_ID: worker-1
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 60s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 1024M }

  db:
    image: postgres:16.15-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: securesend
      POSTGRES_USER: securesend
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - /srv/securesend/db:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U securesend -d securesend"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    shm_size: 256m
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }

  clamav:
    # Isolated scanner. No ports are published; only api/worker reach it on the backend network.
    # freshclam (inside this image) needs outbound HTTPS to database.clamav.net for signature updates.
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    volumes:
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
      - clamav_db:/var/lib/clamav
    networks: [backend, egress]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [SETGID, SETUID, CHOWN, DAC_OVERRIDE]
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    deploy:
      resources:
        # ClamAV loads the full signature set into RAM; 3 GiB is the practical minimum.
        limits: { cpus: "2.0", memory: 4G }

  # Development only: `docker compose --profile dev up`. Captures all outbound mail; never reaches real inboxes.
  mailpit:
    image: axllent/mailpit:v1.22.3
    profiles: [dev]
    networks: [backend]
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

networks:
  frontend:
    driver: bridge
  # backend is internal: the database can never reach the internet.
  backend:
    driver: bridge
    internal: true
  # egress carries only the outbound traffic the design requires: SMTP (api test-send, worker),
  # IdP discovery/token exchange (api) and ClamAV signature downloads (clamav).
  egress:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  clamav_db:
