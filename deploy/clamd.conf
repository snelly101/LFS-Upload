# clamd configuration for the isolated scanner container (deploy/docker-compose.yml → service "clamav").
# These limits determine which files can actually be scanned. The application (CLAMD_MAX_STREAM_BYTES
# in .env) MUST equal StreamMaxLength below: files larger than that are reported as "oversized / not
# scanned" and are blocked from release unless an administrator explicitly enables
# "allow unscanned oversized release" in Transfer policy. Files up to 100 GiB are therefore NOT scanned
# by default; do not claim otherwise.
LogFile /dev/stdout
LogTime yes
LogVerbose no
PidFile /tmp/clamd.pid
TemporaryDirectory /tmp
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
TCPSocket 3310
TCPAddr 0.0.0.0
MaxConnectionQueueLength 30
MaxThreads 4
ReadTimeout 300
CommandReadTimeout 30
SendBufTimeout 500
IdleTimeout 60
SelfCheck 600
ConcurrentDatabaseReload no

# Size limits (keep in sync with CLAMD_MAX_STREAM_BYTES = 4194304000 bytes)
StreamMaxLength 4000M
MaxFileSize 4000M
MaxScanSize 4000M
MaxScanTime 1800000
MaxRecursion 16
MaxFiles 10000
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
MaxPartitions 128
MaxIconsPE 200
MaxRecHWP3 16

# Anything exceeding a limit, or any encrypted archive, is reported as a detection, which the
# application treats as "not clean" (blocked), never as a pass.
AlertExceedsMax yes
AlertEncrypted yes
AlertEncryptedArchive yes
AlertEncryptedDoc yes
AlertBrokenExecutables yes
AlertOLE2Macros yes

ScanPE yes
ScanELF yes
ScanOLE2 yes
ScanPDF yes
ScanSWF yes
ScanHTML yes
ScanXMLDOCS yes
ScanHWP3 yes
ScanMail yes
ScanArchive yes
Bytecode yes
BytecodeSecurity TrustSigned
BytecodeTimeout 60000
DetectPUA no
HeuristicAlerts yes
